[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap"
version = "0.1.0"
description = "Agentic Excel Report Automation Platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Domain contracts
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Browser automation
    "playwright>=1.48.0",
    # Excel COM on Windows
    "pywin32>=306; sys_platform == 'win32'",
    # Document parsing
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    # Hashing
    "xxhash>=3.5.0",
    # Logging / Observability
    "structlog>=24.4.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    # LLM Integration
    "litellm>=1.40.0",
    "instructor>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]
llm = [
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eap"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
